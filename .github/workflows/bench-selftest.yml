name: bench-selftest

on:
  pull_request:
    paths: ["bench/**"]
  push:
    branches: [main]
    paths: ["bench/**"]

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build && npm pack
      - run: npx tsx bench/runner/cli.ts build-images
      - run: npx tsx bench/runner/cli.ts selftest
